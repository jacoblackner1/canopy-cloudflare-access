<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Canopy">
  <title>Canopy</title>
  <!-- Soft circular ground so it reads as an app/login mark -->
  <circle cx="128" cy="128" r="120" fill="#E8F0E9"/>
  <!-- Overlapping canopy leaves -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left leaf -->
    <path d="M128 188
             C78 168 52 128 58 86
             C92 78 118 108 128 148
             Z" fill="#7A9470" opacity="0.95"/>
    <!-- Right leaf -->
    <path d="M128 188
             C178 168 204 128 198 86
             C164 78 138 108 128 148
             Z" fill="#A8C49A" opacity="0.98"/>
    <!-- Center canopy leaf (front) -->
    <path d="M128 196
             C98 150 88 108 108 64
             C128 78 148 78 148 64
             C168 108 158 150 128 196
             Z" fill="#A8C49A"/>
    <!-- Center vein -->
    <path d="M128 86 C128 120 128 150 128 188" stroke="#4A5C42" stroke-width="3.5" fill="none"/>
    <!-- Side veins -->
    <path d="M128 110 C112 118 102 128 96 140" stroke="#4A5C42" stroke-width="2.2" fill="none" opacity="0.7"/>
    <path d="M128 110 C144 118 154 128 160 140" stroke="#4A5C42" stroke-width="2.2" fill="none" opacity="0.7"/>
    <path d="M128 140 C114 148 106 156 100 166" stroke="#4A5C42" stroke-width="2" fill="none" opacity="0.55"/>
    <path d="M128 140 C142 148 150 156 156 166" stroke="#4A5C42" stroke-width="2" fill="none" opacity="0.55"/>
  </g>
  <!-- Small stem -->
  <path d="M128 188 L128 208" stroke="#4A5C42" stroke-width="4" stroke-linecap="round"/>
</svg>
