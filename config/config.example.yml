# Canopy — example cloudflared config (PLACEHOLDERS ONLY for UUID / hostname)
# Copy to the Orange Pi as /etc/cloudflared/config.yml
#
# Origin is the existing Flask dashboard:
#   plant_dashboard.py binds flaskHost 0.0.0.0 / flaskPort 5000
#   Tunnel uses loopback so LAN :5000 and HDMI kiosk stay untouched.

# UUID from: cloudflared tunnel create canopy
tunnel: TUNNEL_UUID_HERE

# Written when the tunnel is created (do not commit real credentials)
credentials-file: /etc/cloudflared/TUNNEL_UUID_HERE.json

# Optional: tighten logging on the Pi
# logfile: /var/log/cloudflared.log
# loglevel: info

ingress:
  # Public hostname → existing Canopy UI (do NOT rebuild Canopy)
  - hostname: canopy.EXAMPLE.com
    service: http://127.0.0.1:5000
    originRequest:
      connectTimeout: 30s
      # Flask is WSGI; also keeps the /video MJPEG stream intact
      disableChunkedEncoding: true
      noTLSVerify: false

  # Catch-all (required): reject anything else
  - service: http_status:404
